name: Onboard to MemBrowse

on:
  workflow_dispatch:
    inputs:
      num_commits:
        description: 'Number of commits to process'
        required: true
        default: '100'
        type: string

permissions:
  contents: read

jobs:
  load-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load target matrix
        id: set-matrix
        run: echo "matrix=$(jq -c '.' .github/membrowse-targets.json)" >> $GITHUB_OUTPUT

  onboard:
    needs: load-targets
    runs-on: ubuntu-latest
    # Same image as ZMK's own build workflow (Zephyr 4.1 SDK). Commits older
    # than the Zephyr 4.1 migration may not build with this image.
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    env:
      # The image's Python is "externally managed" (PEP 668); let the
      # MemBrowse action pip-install itself into it.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-targets.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Onboard iterates through historical commits, so it needs full history
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --add safe.directory '*'

      - name: Install pip for the MemBrowse action
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-pip

      # The west workspace is created one level above the checkout (see
      # setup_cmd) so that the per-commit `git clean -fdx` done by the
      # onboard action does not wipe .west/, zephyr/ and modules/.
      - name: Install packages
        run: ${{ matrix.setup_cmd }}

      - name: Run MemBrowse Onboard Action
        uses: membrowse/membrowse-action/onboard-action@v1
        with:
          target_name: ${{ matrix.target_name }}
          num_commits: ${{ github.event.inputs.num_commits }}
          build_script: ${{ matrix.build_cmd }}
          elf: ${{ matrix.elf }}
          ld: ${{ matrix.ld }}
          map_file: ${{ matrix.map_file }}
          linker_vars: ${{ matrix.linker_vars }}
          binary_search: 'true'
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          api_url: ${{ vars.MEMBROWSE_API_URL }}
