name: MemBrowse Memory Report

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  load-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load target matrix
        id: set-matrix
        run: echo "matrix=$(jq -c '.' .github/membrowse-targets.json)" >> $GITHUB_OUTPUT

  analyze:
    needs: load-targets
    runs-on: ubuntu-latest
    # Same image as ZMK's own build workflow: ships the Zephyr SDK, west,
    # Python and the nanopb/protobuf tooling needed for ZMK Studio builds.
    # Python comes from the container, so no actions/setup-python step here.
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    env:
      # The image's Python is "externally managed" (PEP 668); let the
      # MemBrowse action pip-install itself into it.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-targets.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Trust workspace
        run: git config --global --add safe.directory '*'

      - name: Install pip for the MemBrowse action
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-pip

      # The west workspace is created one level above the checkout (see
      # setup_cmd) so that per-commit `git clean -fdx` in the onboard
      # action does not wipe .west/, zephyr/ and modules/.
      - name: Install packages
        run: ${{ matrix.setup_cmd }}

      - name: Build
        run: ${{ matrix.build_cmd }}

      - name: Run MemBrowse analysis
        uses: membrowse/membrowse-action@v1
        with:
          target_name: ${{ matrix.target_name }}
          elf: ${{ matrix.elf }}
          ld: ${{ matrix.ld }}
          map_file: ${{ matrix.map_file }}
          linker_vars: ${{ matrix.linker_vars }}
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          api_url: ${{ vars.MEMBROWSE_API_URL }}
          verbose: INFO
          # Uncomment to allow CI to pass even when memory budgets are exceeded
          # dont_fail_on_alerts: true
